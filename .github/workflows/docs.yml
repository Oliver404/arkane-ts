name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'docs/mkdocs.yml'
      - 'docs/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install MkDocs + Material + mike
        run: pip install -r docs/requirements-docs.txt

      - name: Configure git for mike commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages with mike
        run: |
          mike deploy --push --update-aliases -F docs/mkdocs.yml 0.0.1 stable
          mike set-default --push -F docs/mkdocs.yml stable
